<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - 100+ App Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { burgundy: '#580016', green: '#00B050' }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between pb-6 mb-8 border-b border-slate-800 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                    Multi-App Control Center (Unlimited Apps)
                </h1>
                <p class="text-sm text-slate-400">Manage all your app IDs from one unified dashboard.</p>
            </div>
            
            <!-- App Selector & Auto-Creator -->
            <div class="flex items-center gap-3 bg-slate-900 border border-slate-800 p-2 rounded-2xl w-full sm:w-auto">
                <label for="appSelector" class="text-xs font-semibold text-slate-400 uppercase tracking-wider pl-2">App ID:</label>
                <select id="appSelector" onchange="switchApp(this.value)" class="bg-slate-800 text-white font-medium text-sm rounded-xl px-3 py-2 border border-slate-700 focus:outline-none focus:border-emerald-500 max-w-[180px]">
                    <option value="app1">Loading apps...</option>
                </select>
                <button type="button" onclick="createNewAppAutomatically()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition-colors whitespace-nowrap">+ Auto New App</button>
            </div>
        </header>

        <!-- Main Configuration Form -->
        <form id="configForm" onsubmit="saveConfig(event)" class="space-y-6 bg-slate-900/60 border border-slate-800/80 rounded-3xl p-6 sm:p-8 backdrop-blur-xl">
            
            <!-- Grid Sections -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- App Identifier -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Internal App Name / Label</label>
                    <input type="text" id="appName" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-sm">
                </div>

                <!-- Theme Color Selector (30 Options) -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Theme Color Palette (30 Options)</label>
                    <select id="themeColor" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-sm">
                        <!-- Safaricom & Burgundy Brand Core -->
                        <option value="#00B050">Safaricom Vibrant Green (#00B050)</option>
                        <option value="#580016">Deep Burgundy Signature (#580016)</option>
                        <option value="#008A3E">Dark Emerald Green</option>
                        <option value="#7A0022">Rich Burgundy Light</option>
                        
                        <!-- Modern Blues & Purples -->
                        <option value="#3B82F6">Royal Blue (#3B82F6)</option>
                        <option value="#1D4ED8">Deep Blue (#1D4ED8)</option>
                        <option value="#6366F1">Indigo Glow (#6366F1)</option>
                        <option value="#8B5CF6">Electric Purple (#8B5CF6)</option>
                        <option value="#A855F7">Amethyst Violet (#A855F7)</option>
                        <option value="#EC4899">Hot Pink (#EC4899)</option>

                        <!-- Warm Accents -->
                        <option value="#EF4444">Crimson Red (#EF4444)</option>
                        <option value="#F97316">Sunset Orange (#F97316)</option>
                        <option value="#F59E0B">Amber Gold (#F59E0B)</option>
                        <option value="#EAB308">Bright Yellow (#EAB308)</option>
                        <option value="#10B981">Teal Emerald (#10B981)</option>
                        <option value="#14B8A6">Cyan Teal (#14B8A6)</option>

                        <!-- Dark Neutrals & Accents -->
                        <option value="#06B6D4">Ocean Cyan (#06B6D4)</option>
                        <option value="#64748B">Slate Gray (#64748B)</option>
                        <option value="#475569">Dark Slate (#475569)</option>
                        <option value="#334155">Midnight Slate (#334155)</option>
                        
                        <!-- Additional Vibrant Palettes -->
                        <option value="#22C55E">Neon Grass Green</option>
                        <option value="#84CC16">Lime Burst</option>
                        <option value="#D946EF">Fuchsia Spark</option>
                        <option value="#FB7185">Rose Pink</option>
                        <option value="#FB923C">Peach Orange</option>
                        <option value="#FACC15">Sun Yellow</option>
                        <option value="#4ADE80">Mint Fresh</option>
                        <option value="#2DD4BF">Turquoise Glow</option>
                        <option value="#38BDF8">Sky Blue</option>
                        <option value="#818CF8">Periwinkle Blue</option>
                    </select>
                </div>

                <!-- Main Heading -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Main Heading Line 1</label>
                    <input type="text" id="heading" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-sm">
                </div>

                <!-- Highlight Text -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Colored Highlight Text (Line 2)</label>
                    <input type="text" id="highlightText" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-sm">
                </div>
            </div>

            <!-- Subtitle -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Subtitle / Description</label>
                <textarea id="subtitle" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-sm resize-none"></textarea>
            </div>

            <!-- Custom Emoji Icon Input -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">App Icon Emoji (Type from keyboard, e.g., 📶, 🌐, 🚀)</label>
                <input type="text" id="appEmoji" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-2xl focus:outline-none focus:border-emerald-500" placeholder="📶">
                <p class="text-[11px] text-slate-500 mt-1">Type any emoji directly from your keyboard. It will be displayed inside the app icon box.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Button Text -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Primary CTA Button Label</label>
                    <input type="text" id="buttonText" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-sm">
                </div>

                <!-- Button URL -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Primary CTA Destination URL</label>
                    <input type="url" id="buttonUrl" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-sm">
                </div>
            </div>

            <!-- Privacy Text -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Privacy Card Disclaimer Text</label>
                <textarea id="privacyText" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-sm resize-none"></textarea>
            </div>

            <!-- Submit Button & Status -->
            <div class="flex items-center justify-between pt-4 border-t border-slate-800">
                <span id="statusMessage" class="text-xs font-medium text-emerald-400 opacity-0 transition-opacity">Changes saved successfully!</span>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg shadow-emerald-900/30 transition-all text-sm">
                    Save App Configuration
                </button>
            </div>
        </form>
    </div>

    <!-- Firebase Script Configuration -->
    <script>
        const firebaseConfig = {
            databaseURL: "https://manage-8771c-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentAppId = "app1";

        // Fetch all apps from database and populate selector
        function initAppSelector() {
            const appsRef = db.ref('apps');
            appsRef.on('value', (snapshot) => {
                const selector = document.getElementById('appSelector');
                selector.innerHTML = '';
                
                const appsData = snapshot.val();
                if (appsData) {
                    const appKeys = Object.keys(appsData);
                    
                    appKeys.forEach(appKey => {
                        const appInfo = appsData[appKey] || {};
                        const opt = document.createElement('option');
                        opt.value = appKey;
                        opt.text = `${appKey} (${appInfo.name || 'Unnamed'})`;
                        selector.add(opt);
                    });

                    if (appKeys.includes(currentAppId)) {
                        selector.value = currentAppId;
                    } else {
                        currentAppId = appKeys[0];
                        selector.value = currentAppId;
                        loadAppData(currentAppId);
                    }
                } else {
                    createNewAppAutomatically();
                }
            });
        }

        function loadAppData(appId) {
            currentAppId = appId;
            db.ref('apps/' + appId).once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('appName').value = data.name || '';
                    document.getElementById('heading').value = data.heading || '';
                    document.getElementById('highlightText').value = data.highlightText || '';
                    document.getElementById('subtitle').value = data.subtitle || '';
                    document.getElementById('buttonText').value = data.buttonText || '';
                    document.getElementById('buttonUrl').value = data.buttonUrl || '';
                    document.getElementById('privacyText').value = data.privacyText || '';
                    document.getElementById('themeColor').value = data.themeColor || '#00B050';
                    document.getElementById('appEmoji').value = data.appEmoji || '📶';
                }
            });
        }

        function switchApp(appId) {
            loadAppData(appId);
        }

        function createNewAppAutomatically() {
            db.ref('apps').once('value').then((snapshot) => {
                let nextNum = 1;
                const appsData = snapshot.val();
                
                if (appsData) {
                    const keys = Object.keys(appsData);
                    const numbers = keys.map(k => parseInt(k.replace('app', ''), 10)).filter(n => !isNaN(n));
                    if (numbers.length > 0) {
                        nextNum = Math.max(...numbers) + 1;
                    }
                }

                const newId = `app${nextNum}`;
                const defaultData = {
                    name: `Campaign App ${nextNum}`,
                    heading: "Welcome to",
                    highlightText: "Free Access",
                    subtitle: "Enjoy seamless daily connection",
                    buttonText: "Get Started",
                    buttonUrl: "https://uplcm.com/4/10932921",
                    privacyText: "Your privacy is protected locally.",
                    themeColor: "#00B050",
                    appEmoji: "📶"
                };

                db.ref('apps/' + newId).set(defaultData).then(() => {
                    currentAppId = newId;
                    loadAppData(newId);
                }).catch(error => {
                    alert("Failed to create app. Make sure your Firebase Rules allow writes (.write: true). Error: " + error.message);
                });
            });
        }

        function saveConfig(event) {
            event.preventDefault();
            const formData = {
                name: document.getElementById('appName').value,
                heading: document.getElementById('heading').value,
                highlightText: document.getElementById('highlightText').value,
                subtitle: document.getElementById('subtitle').value,
                buttonText: document.getElementById('buttonText').value,
                buttonUrl: document.getElementById('buttonUrl').value,
                privacyText: document.getElementById('privacyText').value,
                themeColor: document.getElementById('themeColor').value,
                appEmoji: document.getElementById('appEmoji').value || '📶'
            };

            db.ref('apps/' + currentAppId).set(formData).then(() => {
                const status = document.getElementById('statusMessage');
                status.style.opacity = '1';
                setTimeout(() => { status.style.opacity = '0'; }, 3000);
            }).catch(error => {
                alert("Failed to save changes. Make sure your Firebase Rules allow writes (.write: true). Error: " + error.message);
            });
        }

        window.onload = function() {
            initAppSelector();
            loadAppData(currentAppId);
        };
    </script>
</body>
</html>
