<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Privacy Policy (app12)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; padding: 20px; margin: 0; }
        .admin-container { max-width: 800px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #0f172a; }
        textarea { width: 100%; height: 500px; padding: 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: monospace; font-size: 14px; margin-bottom: 20px; box-sizing: border-box; resize: vertical; }
        button { background: #081B38; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0f172a; }
        .status { margin-left: 15px; font-size: 14px; font-weight: 500; }
        .success { color: #16a34a; }
        .error { color: #dc2626; }
        .tip { background: #e0f2fe; padding: 12px; border-radius: 8px; font-size: 14px; color: #0369a1; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2>Update app12 Privacy Policy</h2>
        
        <div class="tip">
            <strong>Tip:</strong> Paste HTML here (like &lt;h3&gt;, &lt;p&gt;, &lt;ul&gt;). The formatting will be automatically applied inside the app.
        </div>

        <textarea id="editor" placeholder="Loading content from database..."></textarea>
        
        <div style="display: flex; align-items: center;">
            <button id="save-btn">Save to App</button>
            <span id="status-msg" class="status"></span>
        </div>
    </div>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqwgwiukwKb7o6gwnaLoPQSWc7BfMDuYQ",
            authDomain: "besuad.firebaseapp.com",
            databaseURL: "https://besuad-default-rtdb.firebaseio.com",
            projectId: "besuad",
            storageBucket: "besuad.firebasestorage.app",
            messagingSenderId: "641705823615",
            appId: "1:641705823615:web:6502b2511ff8c0f251de4a",
            measurementId: "G-2YSX71N08Q"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const privacyRef = ref(db, 'app12/privacyPolicy/content');

        const editor = document.getElementById('editor');
        const saveBtn = document.getElementById('save-btn');
        const statusMsg = document.getElementById('status-msg');

        // Fetch existing data when page loads
        get(privacyRef).then((snapshot) => {
            if (snapshot.exists()) {
                editor.value = snapshot.val();
            } else {
                editor.value = "";
                editor.placeholder = "Write your HTML privacy policy here...";
            }
        }).catch((error) => {
            console.error("Error loading data:", error);
            statusMsg.textContent = "Error loading data. Check console.";
            statusMsg.className = "status error";
        });

        // Save data to Firebase
        saveBtn.addEventListener('click', () => {
            saveBtn.textContent = "Saving...";
            
            set(privacyRef, editor.value).then(() => {
                saveBtn.textContent = "Save to App";
                statusMsg.textContent = "Successfully saved! Changes are live in the app.";
                statusMsg.className = "status success";
                
                // Clear message after 3 seconds
                setTimeout(() => { statusMsg.textContent = ""; }, 3000);
            }).catch((error) => {
                saveBtn.textContent = "Save to App";
                statusMsg.textContent = "Failed to save: " + error.message;
                statusMsg.className = "status error";
            });
        });
    </script>
</body>
</html>
